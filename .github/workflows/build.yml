name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup project files
        run: |
          mkdir -p /tmp/proj
          cp pubspec.yaml /tmp/proj/pubspec.yaml
          cp -r lib /tmp/proj/lib
          cp android/app/src/main/AndroidManifest.xml /tmp/proj/AndroidManifest.xml

      - name: Create Android platform
        run: flutter create . --platforms=android --project-name brat_player --org com.brat.player

      - name: Apply project files
        run: |
          cp /tmp/proj/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/proj/lib lib
          cp /tmp/proj/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
